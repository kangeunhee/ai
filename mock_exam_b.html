        { qNum: 2, type: "mc", title: "다음 보기의 (ㄱ)에 들어갈 내용으로 적합한 것을 고르시오.", subtext: "[보기] (ㄱ): 사고나 학습 등 인간이 가진 지적 능력을 컴퓨터를 통해 구현하는 기술 (머신러닝과 딥러닝을 포함하는 상위 개념)", options: ["인공지능", "인간지능", "자아지능", "자기지능"], ans: "1", exp: "인간의 지적 능력을 컴퓨터로 구현하는 최고위 기술 개념은 인공지능(AI)입니다." },
        { qNum: 3, type: "mc", title: "다음 중 인공지능을 학습할 때 필요한 장비로 거리가 먼 것을 고르시오.", options: ["중앙처리장치(CPU)", "메인 메모리(RAM)", "그래픽 처리 장치(GPU)", "네트워크 연결 스토리지(NAS)"], ans: "4", exp: "NAS는 단순 네트워크 저장 장치로 AI 모델 연산 및 데이터 처리의 핵심 장비가 아닙니다." },
        { qNum: 4, type: "mc", title: "다음 보기의 (ㄱ), (ㄴ)에 들어갈 머신러닝 유형으로 올바른 것을 고르시오.", subtext: "- (ㄱ): 정답 없이 학습 데이터로 학습, 군집화 등에 사용\n- (ㄴ): 시뮬레이션 반복 학습, 보상/벌칙을 통한 성능 강화 등에 사용", options: ["강화 학습 - 비지도 학습", "비지도 학습 - 강화 학습", "반지도 학습 - 강화 학습", "반복 학습 - 비지도 학습"], ans: "2", exp: "정답 없이 군집화하는 것은 비지도 학습, 보상 시뮬레이션을 수행하는 것은 강화 학습입니다." },
        { qNum: 5, type: "mc", title: "매우 큰 규모의 데이터셋을 학습한 후 인간의 언어를 이해하고 텍스트 생성, 번역, 질문 답변 등을 수행하는 인공지능 모델은?", options: ["거대 언어 모델(LLM)", "스테이블 디퓨전(Stable Diffusion)", "클로드 3(Claude 3)", "제미나이(Gemini)"], ans: "1", exp: "수십억 개 이상의 매개변수로 자연어를 처리하는 대규모 인공지능 모델은 LLM입니다." },
        { qNum: 6, type: "mc", title: "생성자(Generator)와 판별자(Discriminator)가 적대적 경쟁 과정을 통해 함께 학습하며 가짜 데이터를 생성하는 인공지능 모델은?", options: ["사전 학습(Pre-training)", "변이형 자동 인코더(VAE)", "생산적 적대 신경망(GAN)", "미세 조정(Fine-tuning)"], ans: "3", exp: "생성자와 판별자의 적대적 경쟁 구조 알고리즘은 GAN입니다." },
        { qNum: 7, type: "mc", title: "다음 중 GPT의 약자 구성으로 올바르게 짝지어진 것을 고르시오.", subtext: "[ㄱ.Generative / ㄴ.Generation / ㄷ.Pre-trained / ㄹ.Pre-tuned / ㅁ.Translator / ㅂ.Transformer]", options: ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄹ, ㅁ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄷ, ㅂ"], ans: "4", exp: "GPT는 Generative Pre-trained Transformer의 약자입니다." },
        { qNum: 8, type: "mc", title: "다음 중 챗GPT를 효과적으로 사용하기 위한 질의 규칙으로 적절하지 않은 것을 고르시오.", options: ["명확하게 질문해야 한다.", "목적을 말하지 않아도 된다.", "배경 정보를 제공해야 한다.", "질문의 범위를 제한해야 한다."], ans: "2", exp: "챗GPT 답변 정확도를 높이려면 질문 목적과 맥락 정보를 구체적으로 명시해야 합니다." },
        { qNum: 9, type: "mc", title: "마이크로소프트 코파일럿(Copilot)에서 그림 및 이미지를 생성할 때 내부적으로 사용하는 생성 AI는?", options: ["디스코 디퓨전", "미드저니", "달리(DALL-E)", "나이트카페"], ans: "3", exp: "Copilot의 이미지 생성 엔진은 OpenAI의 DALL-E 모델을 바탕으로 동작합니다." },

    ];

    const userAnswers = {};

    // 화면 렌더링 함수
    function renderExam() {
        const form = document.getElementById('exam-form');
        const omrGrid = document.getElementById('omr-grid');
        
        form.innerHTML = '';
        omrGrid.innerHTML = '';

        examQuestions.forEach(q => {
            const qNum = q.qNum;

            // 1. 문제 카드 렌더링
            const card = document.createElement('div');
            card.id = `q-card-${qNum}`;
            card.className = "question-card";

            let inputHtml = "";
            if (q.type === "mc") {
                inputHtml = `<div class="options-grid">` +
                    q.options.map((opt, oIdx) => `
                        <label class="option-label">
                            <input type="radio" name="q_${qNum}" value="${oIdx + 1}" onchange="markOMR(${qNum}, '${oIdx + 1}')">
                            <span><strong>${oIdx + 1}.</strong> ${opt}</span>
                        </label>
                    `).join('') + `</div>`;
            } else {
                inputHtml = `
                    <div style="margin-top: 10px;">
                        <label style="font-size: 12px; font-weight: 700; color: #78716c; display: block; margin-bottom: 5px;">주관식 답안 입력:</label>
                        <input type="text" id="input_q_${qNum}" oninput="markOMR(${qNum}, this.value)" placeholder="정답 단어를 정확히 입력하세요" class="text-input">
                    </div>
                `;
            }

            let subtextHtml = q.subtext ? `<span class="q-subtext">${q.subtext}</span>` : "";

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">문항 ${qNum} / 40</span>
                    <span class="q-type">${q.type === 'mc' ? '객관식 4택1' : '단답형 주관식'}</span>
                </div>
                <h3 class="q-title">${q.title}</h3>
                ${subtextHtml}
                ${inputHtml}
                <div id="exp-q-${qNum}" class="explanation-box">
                    <div class="exp-answer">정답: <span id="ans-text-${qNum}"></span></div>
                    <div><strong>해설:</strong> ${q.exp}</div>
                </div>
            `;
            form.appendChild(card);

            // 2. OMR 그리드 버튼 렌더링
            const omrBtn = document.createElement('button');
            omrBtn.type = "button";
            omrBtn.id = `omr-btn-${qNum}`;
            omrBtn.onclick = () => scrollToQuestion(qNum);
            omrBtn.className = "omr-btn";
            omrBtn.innerText = qNum;
            omrGrid.appendChild(omrBtn);
        });
    }

    // 답안 표기 저장 함수
    function markOMR(qNum, val) {
        if (val && val.trim() !== "") {
            userAnswers[qNum] = val.trim();
            const btn = document.getElementById(`omr-btn-${qNum}`);
            btn.className = "omr-btn active";
        } else {
            delete userAnswers[qNum];
            const btn = document.getElementById(`omr-btn-${qNum}`);
            btn.className = "omr-btn";
        }
        updateAnsweredCounter();
    }

    function updateAnsweredCounter() {
        const count = Object.keys(userAnswers).length;
        document.getElementById('answered-counter').innerText = `${count} / 40 작성`;
    }

    function scrollToQuestion(qNum) {
        const card = document.getElementById(`q-card-${qNum}`);
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 60분 타이머 카운트다운
    let timeLeft = 60 * 60;
    const timerDisplay = document.getElementById('timer-display');
    const timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("시험 제한 시간이 종료되었습니다. 자동으로 제출 및 채점이 완료됩니다.");
            submitExam();
            return;
        }
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }, 1000);

    // 채점 실행 및 오답노트 오픈
    function submitExam() {
        let correctCount = 0;
        const totalQuestions = examQuestions.length;

        examQuestions.forEach(q => {
            const qNum = q.qNum;
            const userVal = userAnswers[qNum];
            const card = document.getElementById(`q-card-${qNum}`);
            const expBox = document.getElementById(`exp-q-${qNum}`);
            const ansText = document.getElementById(`ans-text-${qNum}`);

            expBox.style.display = 'block';

            let isCorrect = false;

            if (q.type === 'mc') {
                ansText.innerText = `${q.ans}번 (${q.options[parseInt(q.ans) - 1]})`;
                if (userVal === q.ans) isCorrect = true;
            } else {
                let correctAnswers = [q.ans];
                if (q.altAns) correctAnswers = correctAnswers.concat(q.altAns);
                ansText.innerText = correctAnswers.join(' 또는 ');

                if (userVal && correctAnswers.some(ans => ans.toLowerCase().replace(/\s+/g, '') === userVal.toLowerCase().replace(/\s+/g, ''))) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                correctCount++;
                card.style.borderColor = '#22c55e';
                card.style.borderWidth = '2px';
            } else {
                card.style.borderColor = '#ef4444';
                card.style.borderWidth = '2px';
            }
        });

        const score = Math.round((correctCount / totalQuestions) * 100);
        const report = document.getElementById('result-report');
        const totalScoreEl = document.getElementById('total-score');
        const correctCountEl = document.getElementById('correct-count');
        const passBadge = document.getElementById('pass-badge');

        report.style.display = 'block';
        totalScoreEl.innerText = `${score}점`;
        correctCountEl.innerText = `${correctCount} / ${totalQuestions}`;

        if (score >= 70) {
            passBadge.innerText = "합격 (PASS)";
            passBadge.className = "pass-badge pass";
        } else {
            passBadge.innerText = "불합격 (FAIL)";
            passBadge.className = "pass-badge fail";
        }

        report.scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = renderExam;
</script>

</body>
</html>
