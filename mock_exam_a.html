    <script>
        const examQuestions = [

            { id: 4, type: "choice", q: "다음 보기에서 설명하고 있는 알고리즘을 고르시오.\n- 결정 과정이 복잡한 문제, 특히 전략 게임에서 최적의 결정을 찾기 위하여 사용되는 알고리즘\n- 바둑에서 알파고(AlphaGo)에 사용됨", options: ["Q-학습(Q-Learning)", "인공신경망(ANN)", "몬테카를로 트리 검색(MCTS)", "탐욕 알고리즘(Greedy Algorithm)"], ans: 3, exp: "바둑 등 복잡한 수읽기에 활용된 알고리즘은 몬테카를로 트리 검색(MCTS)입니다." },

            { id: 6, type: "choice", q: "다음 중 자연어 처리의 특징으로 옳지 않은 것을 고르시오.", options: ["인간의 언어를 컴퓨터가 해석하고 이해할 수 있다.", "컴퓨터가 해석한 데이터를 토대로 새로운 문장을 생성한다.", "인간이 작성한 텍스트에서 감정을 식별하기 어렵다.", "단어 또는 문장이 사용된 문맥을 파악하여 의미를 추론한다."], ans: 3, exp: "감성 분석(Sentiment Analysis)을 통해 텍스트에서 인간의 감정 식별이 가능합니다." },

            renderOMR();
            showQuestion(0);
            startTimer();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("시험 시간이 종료되었습니다. 자동으로 제출됩니다.");
                    submitExam();
                    return;
                }
                timeLeft--;
                const min = Math.floor(timeLeft / 60);
                const sec = timeLeft % 60;
                document.getElementById('timer').innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            }, 1000);
        }

        function showQuestion(idx) {
            currentIdx = idx;
            const q = examQuestions[idx];
            const container = document.getElementById('question-container');
            
            let html = `
                <div class="question-header">
                    <span class="q-badge">문제 ${q.id}</span>
                    <span class="q-type">${q.type === 'choice' ? '객관식 (4지선다)' : '주관식 단답형'}</span>
                </div>
                <h3 class="q-text">${q.q}</h3>
            `;

            if (q.type === 'choice') {
                html += `<div class="options-list">`;
                q.options.forEach((opt, oIdx) => {
                    const isSelected = userAnswers[idx] === (oIdx + 1);

                        <div onclick="selectAnswer(${idx}, ${oIdx + 1})" class="option-item ${isSelected ? 'selected' : ''}">
                            <div class="option-num">${oIdx + 1}</div>
                            <span style="font-size: 14px; color: #2D2A26;">${opt}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                const val = userAnswers[idx] || '';
                html += `
                    <div>
                        <input type="text" value="${val}" oninput="selectAnswer(${idx}, this.value)" placeholder="정답을 입력하세요" class="text-input">
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('question-progress').innerText = `문항 ${idx + 1} / ${examQuestions.length}`;
            updateOMRUI();
        }

        function selectAnswer(qIdx, val) {
            userAnswers[qIdx] = val;
            updateOMRUI();
            if (examQuestions[qIdx].type === 'choice') {
                showQuestion(qIdx);
            }
        }

        function navigateQuestion(step) {
            const newIdx = currentIdx + step;
            if (newIdx >= 0 && newIdx < examQuestions.length) {
                showQuestion(newIdx);
            }
        }

        function renderOMR() {
            const omrGrid = document.getElementById('omr-grid');
            let html = '';
            examQuestions.forEach((q, idx) => {
                html += `
                    <div id="omr-item-${idx}" onclick="showQuestion(${idx})" class="omr-item ${idx === currentIdx ? 'active' : ''}">
                        <span class="omr-item-num">Q${q.id}</span>
                        <span id="omr-val-${idx}" class="omr-item-val">미입력</span>
                    </div>
                `;
            });
            omrGrid.innerHTML = html;
        }

        function updateOMRUI() {
            let answered = 0;
            userAnswers.forEach((ans, idx) => {
                const item = document.getElementById(`omr-item-${idx}`);
                const valSpan = document.getElementById(`omr-val-${idx}`);
                
                if (item) {
                    if (idx === currentIdx) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                }

                if (ans !== null && ans !== '') {
                    answered++;
                    if (valSpan) {
                        valSpan.innerText = ans;
                        valSpan.className = "omr-item-val filled";
                    }
                } else {
                    if (valSpan) {
                        valSpan.innerText = "미입력";
                        valSpan.className = "omr-item-val";
                    }
                }
            });
            document.getElementById('answered-count').innerText = answered;
        }

        function submitExam() {
            if (!confirm("시험을 제출하고 채점 결과를 확인하시겠습니까?")) return;

            clearInterval(timerInterval);
            let correct = 0;

            examQuestions.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                if (q.type === 'choice') {
                    if (parseInt(uAns) === q.ans) correct++;
                } else {
                    if (uAns && q.ans.some(a => a.toLowerCase().trim() === String(uAns).toLowerCase().trim())) {
                        correct++;
                    }
                }
            });

            const score = Math.round((correct / examQuestions.length) * 100);
            const isPass = score >= 70;

            document.getElementById('score-text').innerText = `${score}점`;
            document.getElementById('correct-count').innerText = `${correct}개`;
            document.getElementById('wrong-count').innerText = `${examQuestions.length - correct}개`;

            const badge = document.getElementById('pass-badge');
            if (isPass) {
                badge.innerText = "합격 (PASS)";
                badge.style.backgroundColor = "#ECFDF5";
                badge.style.color = "#059669";
                badge.style.border = "1px solid #A7F3D0";
            } else {
                badge.innerText = "불합격 (FAIL)";
                badge.style.backgroundColor = "#FEF2F2";
                badge.style.color = "#DC2626";
                badge.style.border = "1px solid #FECACA";
            }

            document.getElementById('result-modal').classList.remove('hidden');
        }

        function reviewModalClose() {
            document.getElementById('result-modal').classList.add('hidden');
            
            const container = document.getElementById('question-container');
            let html = `<div style="display: flex; flex-direction: column; gap: 16px;"><h2 style="font-size: 18px; font-weight: 700; border-bottom: 1px solid #EFECE6; padding-bottom: 12px;">전체 문항 해설 및 오답노트</h2>`;

            examQuestions.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                let isCorrect = false;
                if (q.type === 'choice') {
                    isCorrect = parseInt(uAns) === q.ans;
                } else {
                    isCorrect = uAns && q.ans.some(a => a.toLowerCase().trim() === String(uAns).toLowerCase().trim());
                }

                html += `
                    <div style="padding: 16px; border-radius: 14px; border: 1px solid ${isCorrect ? '#A7F3D0' : '#FECACA'}; background-color: ${isCorrect ? '#ECFDF580' : '#FEF2F280'}; display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: 700; color: #2D2A26;">Q${q.id}. ${q.q.split('\n')[0]}</span>
                            <span style="font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: ${isCorrect ? '#059669' : '#DC2626'}; color: #fff;">${isCorrect ? '정답' : '오답'}</span>
                        </div>
                        <div style="font-size: 12px; color: #7A7369;">
                            <p>선택 답안: <span style="font-weight: 600; color: #2D2A26;">${uAns || '미입력'}</span></p>
                            <p>정답: <span style="font-weight: 700; color: #EA580C;">${q.type === 'choice' ? q.ans : q.ans.join(' / ')}</span></p>
                        </div>
                        <div style="background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #EFECE6; font-size: 12px; color: #57534E; line-height: 1.5;">
                            <span style="font-weight: 700; color: #EA580C; display: block; margin-bottom: 2px;">해설:</span>
                            ${q.exp}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
